  /stream/{media_id}/{file}:
    get:
      tags:
      - Playback
      summary: Serve an HLS playlist/segment (or vtt/jpg) for a video — JWT or ?key= path
      description: 'Bearer-or-key variant of the keyed `/stream/k/...` URL. Fetch `playlist.m3u8` first
        (lazily

        transcoded on first hit), then the variant playlists and `.ts` segments it references. Range

        requests supported. Auth: send `Authorization: Bearer <accessToken>` (browser/app) OR a

        Stremio `?key=` (device profile). Parental-blocked or missing media returns a bare 404.

        '
      parameters:
      - name: media_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: file
        in: path
        required: true
        schema:
          type: string
        example: playlist.m3u8
      - name: key
        in: query
        required: false
        schema:
          type: string
        description: Stremio device key (alternative to a bearer)
      responses:
        '200':
          description: file bytes (m3u8 / ts / vtt / jpg)
        '404':
          $ref: '#/components/responses/NotFound'
