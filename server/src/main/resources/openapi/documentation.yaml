          type: string
          format: uuid
        title:
          type: string
        artist:
          type: string
          nullable: true
        album:
          type: string
          nullable: true
        albumArtist:
          type: string
          nullable: true
        trackNumber:
          type: integer
          nullable: true
        discNumber:
