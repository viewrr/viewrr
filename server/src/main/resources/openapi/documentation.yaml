openapi: 3.0.3
info:
  title: viewrr Client API
  version: 0.1.0
  description: "Client-facing contract for viewrr — a self-hosted OTT backend (movies, TV, music).\nThis\
    \ spec is the source of truth that the **viewrr-web** (Vue) and **viewrr-mobile**\n(Compose) clients\
    \ build against. It is mockable with Prism (see `mock/README.md`).\n\n## Auth (Ed25519 self-custody\
    \ — #120/#150; argon2 `/auth` + Keycloak/OIDC retired)\nKeys and signatures are **lowercase hex**\
    \ (raw 32-byte pubkey → 64 chars, raw 64-byte sig →\n128 chars). Ceremony:\n1. `POST /identity/register`\
    \ `{ publicKey, signature }` — `signature` = Ed25519 over the UTF-8\n   bytes of the literal `viewrr:register`.\
    \ Idempotent (201 first time, 200 thereafter).\n2. `GET /identity/challenge` → `{ challenge }` — a\
    \ single-use hex nonce.\n3. `POST /identity/verify` `{ publicKey, challenge, signature }` — `signature`\
    \ = Ed25519 over the\n   UTF-8 bytes of `challenge`. Returns `{ accessToken, refreshToken }`.\n\n\
    Send `accessToken` as `Authorization: Bearer <token>`. Access tokens are HS256 JWTs, **TTL\n15 min**,\
    \ `sub` = account UUID.\n\n> **No refresh endpoint is wired today.** A 30-day `refreshToken` is issued\
    \ but there is no\n> route to redeem it — when the access token expires, **re-run challenge→verify**\
    \ (fresh\n> challenge each time). Do not hardcode a re-auth interval; track the 15-min TTL.\n\n##\
    \ Playback / streaming auth (no bearer)\nThe HLS player itself is authenticated by a **per-device\
    \ stremio-key embedded in the URL\npath**, not by a bearer header. `GET /playback/{id}` (bearer-protected)\
    \ returns a fully\nresolved `url` of the form `/stream/k/{key}/{mediaId}/playlist.m3u8`. The player\
    \ fetches\nthat URL (and its relative segment/variant URIs) with no `Authorization` header. Sidecar\n\
    `subtitlesUrl` / `trickplayUrl` are returned absolute too.\n\nSource of truth: Kotlin `@Serializable`\
    \ DTOs under `server/src/main/kotlin/**`.\n"
