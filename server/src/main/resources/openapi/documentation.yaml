        id:
          type: integer
          format: int64
    WatchEventView:
      type: object
      required:
      - id
      - mediaId
      - positionSecs
      - eventType
      - sessionId
      - createdAt
      properties:
        id:
          type: integer
          format: int64
        mediaId:
          type: string
          format: uuid
        positionSecs:
          type: integer
        eventType:
          type: string
          enum:
          - start
          - progress
          - pause
          - stop
          - finish
        sessionId:
          type: string
          format: uuid
