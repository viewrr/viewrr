  /identity/register:
    post:
      tags:
      - Auth
      summary: Register an Ed25519 public key (idempotent)
      description: '`signature` = Ed25519 over the UTF-8 bytes of the literal `viewrr:register`. First

        registration returns 201; an already-registered key returns 200 with the stored account

        (never a duplicate). `displayName` is a cosmetic petname set once at first register.

        '
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterIdentityRequest'
            example:
              publicKey: 3d4017c3e843895a92b70aa74d1b7ebc9c982ccf2ec4968cc0cd55f12af4660c
              signature: e5564300c360ac729086e2cc806e828a84877f1eb8e5d974d873e065224901555fb8821590a33bacc61e39701cf9b46bd25bf5f0595bbe24655141438e7a100b
      responses:
        '201':
          description: Registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountView'
        '200':
          description: Already registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountView'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /identity/challenge:
    get:
      tags:
      - Auth
      summary: Mint a single-use challenge nonce to sign
      security: []
      responses:
        '200':
          description: Challenge nonce
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChallengeResponse'
              example:
                challenge: 9f8c1a2b3d4e5f60718293a4b5c6d7e8
  /identity/verify:
    post:
      tags:
      - Auth
      summary: Prove key ownership over a challenge, receive session tokens
      description: '`signature` = Ed25519 over the UTF-8 bytes of `challenge`. The nonce is consumed

        (single-use) before the signature check. Bad signature, unknown/consumed challenge, and

        unregistered key all collapse to 401 (no oracle).

        '
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyIdentityRequest'
            example:
              publicKey: 3d4017c3e843895a92b70aa74d1b7ebc9c982ccf2ec4968cc0cd55f12af4660c
              challenge: 9f8c1a2b3d4e5f60718293a4b5c6d7e8
              signature: '...'
      responses:
        '200':
          description: Token pair
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
              example:
                accessToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiI5ZjFkIn0.sig
                refreshToken: f3a9c2e1-7b44-4d2a-9c1e-0a8b6d5e4f30
        '401':
