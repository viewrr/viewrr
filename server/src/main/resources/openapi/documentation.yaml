components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'HS256 JWT access token from `POST /identity/verify` (15-min TTL, `sub` = account UUID).

        The argon2 `/auth` login and Keycloak/OIDC are retired (#120/#150).

        '
    stremioKeyInPath:
      type: apiKey
      in: query
      name: key
      description: 'Marker only — the real credential is the `{key}` **path segment** of

        `/stream/k/{key}/...`, not a query param. OpenAPI has no path-segment apiKey

        location, so this is documented as a distinct scheme to flag that these URLs are

        NOT bearer-protected.

        '
  parameters:
    MediaId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      example: 7d2c1a90-3e44-4b21-9f0a-1c2d3e4f5a6b
  responses:
    Unauthorized:
      description: Missing/invalid credentials. Identity endpoints return `{ error }`; a protected-route
        bearer failure has an empty body.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: signature does not verify
    NotFound:
      description: Not found (also returned for parental-hidden items — existence is never leaked). Empty
        body.
    BadRequest:
      description: Invalid request parameters
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: q is required
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
      required:
      - error
    RegisterIdentityRequest:
      type: object
      required:
      - publicKey
      - signature
      properties:
        publicKey:
          type: string
          description: lowercase hex, raw 32-byte Ed25519 key (64 chars)
        signature:
          type: string
          description: lowercase hex Ed25519 sig (128 chars) over UTF-8 `viewrr:register`
        displayName:
          type: string
          description: optional cosmetic petname, set once at first register
          nullable: true
    ChallengeResponse:
      type: object
      required:
      - challenge
      properties:
        challenge:
          type: string
          description: single-use hex nonce
    VerifyIdentityRequest:
      type: object
      required:
      - publicKey
      - challenge
      - signature
      properties:
        publicKey:
          type: string
          description: lowercase hex, raw 32-byte Ed25519 key
        challenge:
          type: string
          description: the nonce from GET /identity/challenge
        signature:
          type: string
          description: lowercase hex Ed25519 sig over the UTF-8 bytes of `challenge`
    AccountView:
      type: object
      required:
      - accountId
      - publicKey
      properties:
        accountId:
          type: string
          format: uuid
        publicKey:
          type: string
        displayName:
          type: string
          nullable: true
    TokenPair:
      type: object
      required:
      - accessToken
      - refreshToken
      properties:
        accessToken:
          type: string
          description: HS256 JWT, 15-min TTL, sub = account UUID
        refreshToken:
          type: string
          description: opaque, 30-day — NOT redeemable today (no refresh route); re-run challenge→verify
            on expiry
    MediaSearchHit:
      type: object
      description: Reduced /media/search shape. Intentionally OMITS cleanTitle/year/showTitle/artwork
        (see MediaItem). `title` embeds the year.
      required:
      - id
      - title
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          description: raw title, year-embedded
        hlsPath:
          type: string
          nullable: true
        durationSecs:
          type: integer
          nullable: true
        mimeType:
          type: string
          nullable: true
        contentRating:
          type: string
          nullable: true
    StremioKey:
      type: object
      required:
      - key
      - installUrl
      properties:
        key:
          type: string
        installUrl:
          type: string
          format: uri
    MediaItem:
      type: object
      description: Browse/detail item (Kotlin `MediaListItem`). TMDb art fields are null until enriched.
      required:
      - id
      - title
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          description: Raw filename-derived title
        cleanTitle:
          type: string
          description: Normalized display title
          nullable: true
        showTitle:
          type: string
          description: Parent show, for TV episodes
          nullable: true
        seasonNumber:
          type: integer
          nullable: true
        episodeNumber:
          type: integer
          nullable: true
        year:
          type: integer
          nullable: true
        durationSecs:
          type: integer
          nullable: true
        hlsPath:
          type: string
          description: Relative HLS playlist path (not a full URL)
          nullable: true
        contentRating:
          type: string
          description: e.g. G, PG, PG-13, R, TV-MA
          nullable: true
        poster:
          type: string
          format: uri
          description: TMDb poster URL
          nullable: true
        backdrop:
          type: string
          format: uri
          description: TMDb backdrop URL
          nullable: true
        overview:
          type: string
          nullable: true
        contentUuid:
          type: string
          format: uuid
          description: '#124 P2P content address (UUIDv5 of tmdbId); null when no tmdbId'
          nullable: true
    ShowView:
      type: object
      required:
      - showTitle
      - episodeCount
      - seasonCount
      properties:
        showTitle:
          type: string
        episodeCount:
          type: integer
        seasonCount:
          type: integer
    EpisodeView:
      type: object
      required:
      - mediaId
      - title
      properties:
        mediaId:
          type: string
          format: uuid
        title:
          type: string
        seasonNumber:
          type: integer
          nullable: true
        episodeNumber:
          type: integer
          nullable: true
        hlsPath:
          type: string
          nullable: true
    SeasonView:
      type: object
      required:
      - episodes
      properties:
        season:
          type: integer
          nullable: true
        episodes:
          type: array
          items:
            $ref: '#/components/schemas/EpisodeView'
    SeriesDetailView:
      type: object
      required:
      - showTitle
      - seasons
      properties:
        showTitle:
          type: string
        seasons:
          type: array
          items:
            $ref: '#/components/schemas/SeasonView'
    ContinueWatchingItem:
      type: object
      required:
      - mediaId
      - title
      - positionSecs
      - percent
      properties:
        mediaId:
          type: string
          format: uuid
        title:
          type: string
        hlsPath:
          type: string
          nullable: true
        durationSecs:
          type: integer
          nullable: true
        positionSecs:
          type: integer
        percent:
          type: integer
          minimum: 0
          maximum: 100
    Recommendation:
      type: object
      required:
      - mediaId
      - title
      - score
      - rank
      properties:
        mediaId:
          type: string
          format: uuid
        title:
          type: string
        hlsPath:
          type: string
          nullable: true
        score:
          type: number
          format: float
        rank:
          type: integer
          description: 1-based rank
    WatchEventCreate:
      type: object
