openapi: 3.0.3
info:
  title: viewrr API
  version: "1.0.0"
  description: |
    Self-hosted OTT backend — movies, TV, and music.

    **Auth (Ed25519 self-custody, #120).** The argon2 `/auth` login and Keycloak/OIDC are retired;
    this challenge→verify ceremony is the SOLE auth path. Keys and signatures are **lowercase hex**
    (raw 32-byte public key → 64 hex chars; raw 64-byte signature → 128 hex chars).

    1. `POST /identity/register` `{ publicKey, signature }` — `signature` = Ed25519 over the UTF-8
       bytes of the literal `viewrr:register`. Idempotent (re-registering a key is a no-op 200).
    2. `GET /identity/challenge` → `{ challenge }` — a single-use hex nonce.
    3. `POST /identity/verify` `{ publicKey, challenge, signature }` — `signature` = Ed25519 over the
       UTF-8 bytes of the `challenge` string. Returns `{ accessToken, refreshToken }`.

    Send `accessToken` as `Authorization: Bearer <token>` on every authenticated endpoint. Access
    tokens are **HS256 JWTs, TTL 15 min** (`viewrr.auth.accessTtlMinutes`), `sub` = account UUID.

    **No refresh endpoint is wired today.** A `refreshToken` (opaque, 30-day) is issued but there is
    currently no route to redeem it — when the access token expires, **re-run challenge→verify**
    (get a fresh challenge each time; nonces are single-use). Track re-auth against the 15-min TTL,
    not a hardcoded guess.

    **Error shape.** Handled errors return `{ "error": "<message>" }` (validation 400, identity 401,
    rec-engine 503). Bare `NotFoundException` (missing OR parental-hidden media) and JWT auth
    failures (missing/expired/invalid token) return the status code with **an empty body** — a 404
    never distinguishes "absent" from "blocked", and identity 401s never distinguish "unknown key"
    from "bad signature" (no oracle).
servers:
  - url: http://localhost:8080
    description: Local dev
  - url: "{publicBaseUrl}"
    description: Deployment
    variables:
      publicBaseUrl:
        default: http://localhost:8080
tags:
  - name: System
  - name: Identity
  - name: Movies
  - name: Music
  - name: Playback
  - name: Collections
  - name: Watch
  - name: Admin
security:
  - bearerAuth: []
paths:
  /health:
    get:
      tags: [System]
      summary: Liveness probe
      security: []
      responses:
        "200": { description: ok, content: { text/plain: { schema: { type: string, example: ok } } } }

  /identity/register:
    post:
      tags: [Identity]
      summary: Register an Ed25519 public key (idempotent)
      description: |
        `signature` is Ed25519 over the UTF-8 bytes of the literal `viewrr:register` by the key's
        secret. Idempotent: a first registration returns 201, an already-registered key returns 200
        with the stored account (never a duplicate). `displayName` is an optional cosmetic petname
        set once at first register; it is NOT re-writable by re-registering.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterIdentityRequest" }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/AccountView" } } } }
        "200": { description: Already registered, content: { application/json: { schema: { $ref: "#/components/schemas/AccountView" } } } }
        "401": { description: "signature does not verify — `{ error }`", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /identity/challenge:
    get:
      tags: [Identity]
      summary: Mint a single-use challenge nonce to sign
      description: Each call returns a fresh, single-use hex nonce. Consumed on `/identity/verify`; get a new one per verify attempt.
      security: []
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ChallengeResponse" } } } }
  /identity/verify:
    post:
      tags: [Identity]
      summary: Prove key ownership over a challenge, receive session tokens
      description: |
        `signature` is Ed25519 over the UTF-8 bytes of the `challenge` string. The challenge is
        consumed (single-use) before the signature check, so a replayed body cannot mint a second
        session. On success returns the app's normal token pair.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VerifyIdentityRequest" }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/TokenPair" } } } }
        "401": { description: "bad signature / unknown-or-consumed challenge / unregistered key — all collapse to `{ error }` (no oracle)", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /media:
    get:
      tags: [Movies]
      summary: List all videos the caller can see (parental-filtered)
      description: |
        Returns the **rich** `MediaListItem` (includes `cleanTitle`, `year`, `showTitle`, artwork).
        `title` embeds the year (e.g. `"Sintel (2010)"`); for display/matching prefer `cleanTitle` +
        `year`, which are the parsed, separated fields. `/media/search` returns a **reduced** shape —
        match search hits back to this list by `id` if you need the extra fields.
      parameters:
        - { name: sort, in: query, schema: { type: string, enum: [title, createdAt], default: title }, description: "createdAt desc = Recently Added" }
        - { name: order, in: query, schema: { type: string, enum: [asc, desc], default: asc } }
        - { name: limit, in: query, schema: { type: integer, default: 200, minimum: 1, maximum: 1000 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/MediaListItem" } }
        "401": { description: missing/expired token }
  /media/search:
    get:
      tags: [Movies]
      summary: Full-text (BM25) search over titles
      description: |
        ParadeDB `@@@` BM25 over `title`; `q` accepts Tantivy syntax (`+matrix -resurrections`).
        Returns the **reduced** `MediaSearchHit` (no `cleanTitle`/`year`/`showTitle`/artwork — those
        live only on `/media`). `title` still embeds the year. Match hits to `/media` by `id` when
        you need the full record.
      parameters:
        - { name: q, in: query, required: true, schema: { type: string }, description: query string (Tantivy syntax) }
        - { name: limit, in: query, schema: { type: integer, default: 20, minimum: 1 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/MediaSearchHit" } }
        "400": { description: blank query }
  /series:
    get:
      tags: [Movies]
      summary: List TV shows (files named SxxExx) with episode/season counts
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/ShowView" } }
  /series/{showTitle}:
    get:
      tags: [Movies]
      summary: Episodes of a show grouped by season
      parameters:
        - { name: showTitle, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/SeriesDetailView" } } } }
        "404": { description: unknown show }
  /me/continue-watching:
    get:
      tags: [Movies]
      summary: In-progress videos for the current user (resume)
      description: Each media's latest watch_event, excluding media whose latest event is `finish`, newest-resumed first.
      parameters:
        - { name: limit, in: query, schema: { type: integer, default: 20, minimum: 1, maximum: 100 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/ContinueWatchingItem" } }
  /me/recommendations:
    get:
      tags: [Movies]
      summary: Pre-computed recommendations for the current user
      parameters:
        - { name: limit, in: query, schema: { type: integer, default: 20, minimum: 1, maximum: 100 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Recommendation" } }

  /stream/{media_id}/{file}:
    get:
      tags: [Playback]
      summary: Serve an HLS playlist/segment (or vtt/jpg) for a video
      description: |
        Fetch `playlist.m3u8` first (lazily transcoded on first hit), then the variant playlists and
        `.ts` segments it references. Range requests supported. Identity: send `Authorization: Bearer
        <accessToken>` (browser/app), or pass a Stremio `?key=` (device profile). Parental-blocked or
        missing media returns a bare **404** (never distinguishes the two).
      parameters:
        - { name: media_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: file, in: path, required: true, schema: { type: string }, example: playlist.m3u8 }
      responses:
        "200": { description: file bytes (m3u8 / ts / vtt / jpg) }
        "404": { description: not found or blocked by parental rating }
  /media/{media_id}/subtitles:
    get:
      tags: [Playback]
      summary: List subtitle tracks (extracts embedded tracks to WebVTT on first call)
      parameters:
        - { name: media_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/SubtitleTrack" } }
  /media/{media_id}/trickplay:
    get:
      tags: [Playback]
      summary: Seek-preview sprite sheet + WebVTT (generated on first call)
      parameters:
        - { name: media_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/TrickplayInfo" } } } }
        "404": { description: media missing or too short for trickplay }

  /music/albums:
    get:
      tags: [Music]
      summary: List all albums
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/AlbumView" } }
  /music/albums/{album}/tracks:
    get:
      tags: [Music]
      summary: List tracks in an album (track-ordered)
      parameters:
        - { name: album, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/TrackView" } }
        "404": { description: unknown album }
  /music/tracks/{id}/audio:
    get:
      tags: [Music]
      summary: Stream the original audio file (range supported)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: audio bytes }
        "206": { description: partial content (range) }
        "404": { description: track or file not found }

  /collections:
    get:
      tags: [Collections]
      summary: List the current user's collections
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/CollectionView" } } } } }
    post:
      tags: [Collections]
      summary: Create a collection
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [name], properties: { name: { type: string } } } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/CollectionView" } } } }
  /collections/{id}:
    get:
      tags: [Collections]
      summary: Collection with its items
      parameters: [ { name: id, in: path, required: true, schema: { type: string, format: uuid } } ]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/CollectionDetailView" } } } }
        "404": { description: not found / not owner }
    delete:
      tags: [Collections]
      summary: Delete a collection
      parameters: [ { name: id, in: path, required: true, schema: { type: string, format: uuid } } ]
      responses: { "204": { description: No Content }, "404": { description: not found } }
  /collections/{id}/items:
    post:
      tags: [Collections]
      summary: Add a media item to a collection
      parameters: [ { name: id, in: path, required: true, schema: { type: string, format: uuid } } ]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [mediaId], properties: { mediaId: { type: string, format: uuid }, position: { type: integer, default: 0 } } } } }
      responses: { "204": { description: No Content }, "404": { description: not found } }
  /collections/{id}/items/{mediaId}:
    delete:
      tags: [Collections]
      summary: Remove a media item from a collection
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: mediaId, in: path, required: true, schema: { type: string, format: uuid } }
      responses: { "204": { description: No Content }, "404": { description: not found } }

  /watch-events:
    post:
      tags: [Watch]
      summary: Record a playback event (drives resume)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/WatchEvent" } } }
      responses:
        "201": { description: recorded, content: { application/json: { schema: { $ref: "#/components/schemas/WatchEventCreated" } } } }
        "400": { description: "invalid eventType / negative positionSecs / non-UUID id — `{ error }`", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /watch-events/me:
    get:
      tags: [Watch]
      summary: Recent watch events for the current user, for one media
      parameters:
        - { name: mediaId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: limit, in: query, schema: { type: integer, default: 50, minimum: 1, maximum: 50 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/WatchEventView" } }

  /admin/libraries:
    get:
      tags: [Admin]
      summary: List libraries
      responses: { "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/LibraryView" } } } } } }
    post:
      tags: [Admin]
      summary: Create a library (kind = movies | shows | music). Scans + (video) watches on create.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CreateLibraryRequest" } } }
      responses: { "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/LibraryView" } } } } }
  /admin/libraries/{id}:
    patch:
      tags: [Admin]
      summary: Rename / enable-disable watching
      parameters: [ { name: id, in: path, required: true, schema: { type: string, format: uuid } } ]
      requestBody:
        content: { application/json: { schema: { type: object, properties: { name: { type: string }, watchEnabled: { type: boolean } } } } }
      responses: { "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/LibraryView" } } } } }
    delete:
      tags: [Admin]
      summary: Delete a library
      parameters: [ { name: id, in: path, required: true, schema: { type: string, format: uuid } } ]
      responses: { "204": { description: No Content } }
  /admin/libraries/{id}/scan:
    post:
      tags: [Admin]
      summary: Trigger a re-scan
      parameters: [ { name: id, in: path, required: true, schema: { type: string, format: uuid } } ]
      responses: { "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ScanResult" } } } } }
  /admin/media/{id}/transcode:
    post:
      tags: [Admin]
      summary: Trigger HLS transcode (or remux) of a media item
      parameters: [ { name: id, in: path, required: true, schema: { type: string, format: uuid } } ]
      responses: { "200": { description: OK, content: { application/json: { schema: { type: object, properties: { mediaId: { type: string }, hlsPath: { type: string } } } } } } }
  /admin/media/{id}:
    patch:
      tags: [Admin]
      summary: Set a media item's content rating (G | PG | PG-13 | R | NC-17 | null)
      parameters: [ { name: id, in: path, required: true, schema: { type: string, format: uuid } } ]
      requestBody:
        content: { application/json: { schema: { type: object, properties: { contentRating: { type: string, nullable: true, example: PG-13 } } } } }
      responses: { "204": { description: No Content }, "400": { description: invalid rating }, "404": { description: not found } }
  /admin/users:
    get:
      tags: [Admin]
      summary: List users
      responses: { "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/UserView" } } } } } }
  /admin/users/{id}/promote:
    post:
      tags: [Admin]
      summary: Set/clear admin
      parameters: [ { name: id, in: path, required: true, schema: { type: string, format: uuid } } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [isAdmin], properties: { isAdmin: { type: boolean } } } } } }
      responses: { "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/UserView" } } } } }
  /admin/users/{id}/active:
    post:
      tags: [Admin]
      summary: Enable / disable a user (disabled users can't log in)
      parameters: [ { name: id, in: path, required: true, schema: { type: string, format: uuid } } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [active], properties: { active: { type: boolean } } } } } }
      responses: { "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/UserView" } } } } }
  /admin/users/{id}/max-rating:
    post:
      tags: [Admin]
      summary: Set a user's parental max rating (null = unrestricted)
      parameters: [ { name: id, in: path, required: true, schema: { type: string, format: uuid } } ]
      requestBody: { content: { application/json: { schema: { type: object, properties: { maxRating: { type: string, nullable: true, example: PG-13 } } } } } }
      responses: { "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/UserView" } } } } }
  /admin/users/{id}:
    delete:
      tags: [Admin]
      summary: Delete a user (cannot delete yourself)
      parameters: [ { name: id, in: path, required: true, schema: { type: string, format: uuid } } ]
      responses: { "204": { description: No Content }, "400": { description: self-delete }, "404": { description: not found } }
  /admin/recs/refresh:
    post:
      tags: [Admin]
      summary: Trigger a recommendations recompute (gRPC to the rec engine)
      responses: { "200": { description: OK } }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Error:
      type: object
      description: "Body of handled errors (validation 400, identity 401, rec-engine 503). Bare 404s and JWT auth failures have NO body."
      properties:
        error: { type: string }
    RegisterIdentityRequest:
      type: object
      required: [publicKey, signature]
      properties:
        publicKey: { type: string, description: "lowercase hex, raw 32-byte Ed25519 key (64 chars)" }
        signature: { type: string, description: "lowercase hex Ed25519 sig (128 chars) over UTF-8 `viewrr:register`" }
        displayName: { type: string, nullable: true, description: "optional cosmetic petname, set once at first register" }
    ChallengeResponse:
      type: object
      properties:
        challenge: { type: string, description: single-use hex nonce }
    VerifyIdentityRequest:
      type: object
      required: [publicKey, challenge, signature]
      properties:
        publicKey: { type: string, description: "lowercase hex, raw 32-byte Ed25519 key" }
        challenge: { type: string, description: "the nonce from GET /identity/challenge" }
        signature: { type: string, description: "lowercase hex Ed25519 sig over the UTF-8 bytes of `challenge`" }
    AccountView:
      type: object
      description: Returned by /identity/register — the account, no secret material.
      properties:
        accountId: { type: string, format: uuid }
        publicKey: { type: string }
        displayName: { type: string, nullable: true }
    TokenPair:
      type: object
      description: "Returned by /identity/verify. accessToken = HS256 JWT (15-min TTL, sub=accountId). refreshToken issued but not yet redeemable — re-run challenge→verify on expiry."
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
    MediaListItem:
      type: object
      description: "Rich catalog record. `title` embeds the year (`Sintel (2010)`); `cleanTitle`+`year` are the separated display/match fields."
      properties:
        id: { type: string, format: uuid }
        title: { type: string, description: "raw title, year-embedded" }
        cleanTitle: { type: string, nullable: true, description: "parsed title without year — prefer for display/matching" }
        showTitle: { type: string, nullable: true }
        seasonNumber: { type: integer, nullable: true }
        episodeNumber: { type: integer, nullable: true }
        year: { type: integer, nullable: true }
        durationSecs: { type: integer, nullable: true }
        hlsPath: { type: string, nullable: true, description: "null = not yet transcoded" }
        contentRating: { type: string, nullable: true }
        poster: { type: string, nullable: true, description: "TMDb art, null until enriched" }
        backdrop: { type: string, nullable: true }
        overview: { type: string, nullable: true }
        tmdbVoteAverage: { type: number, format: float, nullable: true, description: 0.0..10.0 }
        tmdbVoteCount: { type: integer, nullable: true }
        contentUuid: { type: string, nullable: true, description: "#124 P2P swarm content address (null if no tmdbId)" }
    MediaSearchHit:
      type: object
      description: "Reduced search shape. Intentionally OMITS cleanTitle/year/showTitle/artwork (see /media). `title` embeds the year."
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        hlsPath: { type: string, nullable: true }
        durationSecs: { type: integer, nullable: true }
        mimeType: { type: string, nullable: true }
        contentRating: { type: string, nullable: true }
    Recommendation:
      type: object
      description: Pre-computed by the out-of-process Python rec engine.
      properties:
        mediaId: { type: string, format: uuid }
        title: { type: string }
        hlsPath: { type: string, nullable: true }
        score: { type: number, format: float }
        rank: { type: integer, description: 0-based position }
    ShowView:
      type: object
      properties:
        showTitle: { type: string }
        episodeCount: { type: integer }
        seasonCount: { type: integer }
    EpisodeView:
      type: object
      properties:
        mediaId: { type: string, format: uuid }
        title: { type: string }
        seasonNumber: { type: integer, nullable: true }
        episodeNumber: { type: integer, nullable: true }
        hlsPath: { type: string, nullable: true }
    SeasonView:
      type: object
      properties:
        season: { type: integer, nullable: true }
        episodes: { type: array, items: { $ref: "#/components/schemas/EpisodeView" } }
    SeriesDetailView:
      type: object
      properties:
        showTitle: { type: string }
        seasons: { type: array, items: { $ref: "#/components/schemas/SeasonView" } }
    ContinueWatchingItem:
      type: object
      properties:
        mediaId: { type: string, format: uuid }
        title: { type: string }
        hlsPath: { type: string, nullable: true }
        durationSecs: { type: integer, nullable: true }
        positionSecs: { type: integer }
        percent: { type: integer }
    SubtitleTrack:
      type: object
      properties:
        index: { type: integer }
        lang: { type: string, nullable: true }
        label: { type: string, nullable: true }
        url: { type: string }
    TrickplayInfo:
      type: object
      properties:
        spriteUrl: { type: string }
        vttUrl: { type: string }
        intervalSecs: { type: integer }
        thumbW: { type: integer }
        thumbH: { type: integer }
        tileCols: { type: integer }
    AlbumView:
      type: object
      properties:
        album: { type: string }
        trackCount: { type: integer }
        artist: { type: string, nullable: true }
    TrackView:
      type: object
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        artist: { type: string, nullable: true }
        album: { type: string, nullable: true }
        trackNumber: { type: integer, nullable: true }
        discNumber: { type: integer, nullable: true }
        durationSecs: { type: integer, nullable: true }
    CollectionView:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        createdAt: { type: string }
    CollectionItemView:
      type: object
      properties:
